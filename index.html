<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS193V Jigsaw</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>CS193V Jigsaw</h1>
    <p class="help">
      Drag the pieces on the right into the empty grid on the left to put the picture back together.
      Move them around as much as you like: drop a piece on another one to swap them, or drag it
      back to the right.
    </p>
  </header>

  <main class="field">
    <section class="half">
      <h2>Puzzle</h2>
      <div class="frame">
        <div id="board" class="grid board" aria-label="Puzzle board"></div>
      </div>
    </section>

    <section class="half">
      <h2>Pieces</h2>
      <div class="frame">
        <div id="tray" class="grid tray" aria-label="Unplaced pieces"></div>
        <div id="win" class="win hidden" aria-live="polite">
          <h3>You did it!</h3>
          <p id="win-text"></p>
          <button id="next" type="button">Next puzzle</button>
        </div>
      </div>
    </section>
  </main>

  <script src="logic.js"></script>
  <script src="pictures.js"></script>
  <script src="ui.js"></script>
</body>
</html>
